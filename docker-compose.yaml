services:

  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"
    environment:
      CUSTOMER_SERVICE_URL: http://customer-service:8081
      ACCOUNT_SERVICE_URL: http://account-service:8082
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - customer-service
      - account-service

  customer-service:
    build: ./customer-service
    expose:
      - "8081"

  account-service:
    build: ./account-service
    ports:
      - "8082:8082"
    environment:
      CUSTOMER_SERVICE_URL: "http://customer-service:8081"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "banking-kafka:29092"
